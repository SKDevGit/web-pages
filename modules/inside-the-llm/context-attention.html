const CAP = 400;

const LAYERS = [

  { id: "skills", n: "Skills and tool descriptions", w: "product", size: 50, what: "Packaged instructions and tool descriptions the product makes available, so the model knows what it can do.", ex: "A returns skill that explains the steps, and a description of an order-lookup tool.", ctl: "The product builder. Some products let you add your own skills." },

  { id: "docs", n: "Retrieved documents", w: "lookup", size: 70, what: "Passages the product searched for and added because they look relevant. This is retrieval, or RAG.", ex: "The returns policy: 30 days, and damaged items qualify.", ctl: "Whoever sets up the document search, which can be your firm." },
  { id: "conv", n: "Conversation so far", w: "you", size: 60, what: "Earlier messages and replies in this chat. All of it is sent again with every new message.", ex: "The customer: “The product arrived damaged.”", ctl: "You, by how long you keep one chat going." },
  { id: "tool", n: "Tool results", w: "lookup", size: 30, what: "What a tool returned when the model or the product asked it for something.", ex: "Order lookup: delivered, inside the return window.", ctl: "The product and its tools." },
  { id: "req", n: "Your request", w: "you", size: 20, what: "The message you just sent.", ex: "“the customer returned the product because…”", ctl: "You." },
  { id: "reply", n: "The model’s reply so far", w: "model", size: 25, what: "Tokens the model has already written. Each new token is added here, so the context grows as the model writes.", ex: "“…it was damaged.”", ctl: "Nobody directly. Asking for shorter replies keeps it small." }
];
const legend = () => h("div", { class: "legend" }, ...Object.entries(WHO).map(([k, v]) => h("span", { class: "l-" + k, text: v })));
const segs = (list, cap) => { const m = h("div", { class: "meter" }); list.forEach(([w, size, t]) => m.append(h("i", { class: "sup-" + w, title: t, style: { width: size / cap * 100 + "%" } }))); return m; };
function picture(host, click) {

  const wrap = h("div"), map = h("div", { class: "ctxmap" }), left = h("div", { class: "cm-in" }), right = h("div", { class: "stack", style: { gap: "10px" } });
  const detail = h("div", { style: { display: "grid" } }), dets = LAYERS.map(l => h("div", { class: "note", style: { gridArea: "1 / 1", margin: 0, visibility: "hidden" } }, h("b", { text: l.n + ". " }), l.what + " ", h("i", { text: "Example: " }), l.ex + " ", h("i", { text: "Who controls it: " }), l.ctl)); dets.forEach(d => detail.append(d));
  const showDetail = () => { if (!click) return; dets.forEach((d, i) => d.style.visibility = i === sel ? "visible" : "hidden"); left.querySelectorAll(".cl").forEach((b, i) => b.classList.toggle("sel", i === sel)); };
  left.append(h("div", { class: "cm-h", text: "Sent in with every request" }));
  LAYERS.forEach((l, i) => left.append(h(click ? "button" : "div", { class: "cl sup-" + l.w, onclick: click ? () => { sel = i; showDetail(); } : null }, h("span", { text: l.n }), h("small", { text: l.id === "reply" ? "grows" : WHO[l.w] }))));
  right.append(h("div", { class: "cm-model" }, h("b", { text: "The model" }), h("div", { class: "hint", style: { margin: 0 }, text: "Its working memory is the context window. It reads all of it every time it picks a token, and it is limited." }), segs(LAYERS.map(l => [l.w, l.size, l.n + ": " + l.size + " tokens"]), CAP), h("div", { class: "hint", style: { margin: 0 }, text: tot + " of " + CAP + " tokens used (toy numbers)" })),
    h("div", { class: "cm-out", text: "Output: the next token" }), h("div", { class: "cm-loop", text: "↺ The new token is added to the context, then the model reads it all again." }));

const SORT1 = [
  { t: "How to write a polite sentence", a: 0, why: "General language skill was learned in training and stored in the parameters." },
  { t: "This company’s 30-day return rule", a: 1, why: "The model could not learn it in training. It has to be in working memory." },
  { t: "What a refund is, in general", a: 0, why: "General knowledge comes from training." },
  { t: "What the customer said earlier in the chat", a: 1, why: "Earlier messages are sent in again as part of the context." },
  { t: "The order’s delivery status from a lookup", a: 1, why: "Current, specific facts have to be supplied, for example by a tool." }
];
function fillInit(host) {
  hostOf(host, `<div class="widget"><div class="label">A chat with a toy window of ${CAP} tokens</div><div id="fl-meter"></div><div class="hint" id="fl-info"></div><div class="note" id="fl-note" style="min-height:3.6em;visibility:hidden"></div>
<div class="row" style="margin-top:8px"><button class="btn primary" id="fl-send">Send another message</button><button class="btn" id="fl-compact">Compact the chat</button><button class="btn sm" id="fl-new">Start a new chat</button></div></div>`);
  const FIX = LAYERS.filter(l => ["sys", "skills", "mem", "docs"].includes(l.id)).reduce((a, l) => a + l.size, 0), TURN = 55;
  let turns = 0, summary = 0, note = "";
  const used = () => FIX + summary + turns * TURN;
  function draw() {
    const parts = LAYERS.filter(l => ["sys", "skills", "mem", "docs"].includes(l.id)).map(l => [l.w, l.size, l.n]);
    if (summary) parts.push(["model", summary, "Summary of the earlier chat"]);
    for (let i = 0; i < turns; i++) parts.push([i % 2 ? "model" : "you", TURN, "Message " + (i + 1) + " and its reply"]);
    const m = segs(parts, CAP); if (used() + TURN > CAP) m.classList.add("full");
    clear($("#fl-meter")).append(m, legend());
    $("#fl-info").textContent = "Sent to the model with the next message: " + (used() + 20) + " tokens of " + CAP + " (before it writes). Fixed layers: " + FIX + " tokens. Chat so far: " + (summary + turns * TURN) + " tokens.";
    const full = used() + TURN > CAP;
    $("#fl-send").disabled = full; $("#fl-compact").disabled = turns === 0;
    const n = $("#fl-note"); n.style.visibility = (note || full) ? "visible" : "hidden"; n.textContent = note || (full ? "The window is nearly full. The next message would not fit, so the product must drop the oldest turns, compact the chat into a summary, or you start a new chat." : "");
  }
  $("#fl-send").onclick = () => { turns++; note = ""; draw(); };
  $("#fl-compact").onclick = () => { turns = 0; summary = 30; note = "Compacted: the earlier turns were replaced by a short summary. This frees space, but details can be lost."; draw(); };
  $("#fl-new").onclick = () => { turns = 0; summary = 0; note = ""; draw(); };
  draw();
}
function answerFor(on) {
  const pre = on.sys ? "Thank you for getting in touch. " : "";
  let a;
  if (on.docs && on.conv && on.tool) a = "Yes. Your policy allows returns within 30 days and damaged items qualify, and this order was delivered inside that window. Please send a prepaid return label.";
  else if (on.docs && on.conv) a = "Your policy allows returns within 30 days, and a damaged item qualifies. I cannot see the order date, so please confirm it is inside the window.";
  else if (on.docs) a = "Your policy allows returns within 30 days. Tell me which product it is and what is wrong with it.";
  else if (on.conv) a = "I am sorry the product arrived damaged. I do not have your return policy, so I cannot say whether it can be returned.";
  else a = "I cannot tell. I do not have your return policy or any details about the order.";
  return pre + a + (on.sys ? " Is there anything else I can help with?" : "");
}
function toggleInit(host) {
  hostOf(host, `<div class="widget"><div class="label">Switch layers on, one at a time</div><div class="row" id="tg-chips"></div><div class="label">The question, always the same</div><div class="docbox" style="padding:8px 12px;font-weight:600">Can this customer return the product?</div><div class="label">What else the model can see</div><div class="docbox" id="tg-seen" style="line-height:1.3;padding:8px 12px"></div><div class="label">The reply</div><div class="docbox" id="tg-ans" style="line-height:1.4;padding:8px 12px"></div><p class="hint" style="margin:0">A scripted illustration with simple rules, not a real model.</p></div>`);
  const OPTS = [["sys", "System instructions", "“You are a support assistant. Be polite and brief.”"], ["docs", "Returns policy document", "“Returns: 30 days, and damaged items qualify.”"], ["conv", "Conversation so far", "Customer: “The product arrived damaged.”"], ["tool", "Order lookup result", "Order status: delivered, inside the return window."]];
  const on = { sys: false, docs: false, conv: false, tool: false };
  function draw() {
    const c = clear($("#tg-chips")); OPTS.forEach(o => c.append(h("button", { class: "btn sm" + (on[o[0]] ? " on" : ""), onclick: () => { on[o[0]] = !on[o[0]]; draw(); } }, o[1])));
    c.append(h("button", { class: "btn sm", onclick: () => { OPTS.forEach(o => on[o[0]] = false); draw(); } }, "Switch all off"), h("button", { class: "btn sm", onclick: () => { OPTS.forEach(o => on[o[0]] = true); draw(); } }, "Switch all on"));
    const seen = clear($("#tg-seen")); const act = OPTS.filter(o => on[o[0]]); if (!act.length) seen.append(h("span", { class: "hint", text: "Nothing else. Only the question." })); act.forEach(o => seen.append(h("div", { text: o[2] })));
    $("#tg-ans").textContent = answerFor(on);
  }
  draw();
}
const ATT_OPTS = [

    w: [["Hi,", 0.5], ["thanks", 0.4], ["for", 0.2], ["the", 0.15], ["update.", 0.6], ["Anyway,", 0.5], ["they", 0.9], ["sent", 0.8], ["it", 1.2], ["back", 0.7], ["because", 0.4], ["it", 1], ["was", 0.4], ["damaged,", 1.6], ["I", 0.6], ["think.", 0.5], ["Is", 0.6], ["it", 1.4]], q: "covered?" },

function attInit(host) {

lesson({
  title: "Context",
  lede: "A model has two kinds of memory: built-in memory from training, and working memory, which is what is in front of it right now. This lesson is about working memory. It shows everything that goes into the context, why the window is limited, and how to give the model the facts it needs.",
  learn: `<b>By the end you can</b>list what goes into the context, explain why a long chat costs more, and say how supplying facts changes an answer.`,
  steps: [
    {
      title: "Two kinds of memory",
      main: `<p>A model answers from two kinds of memory.</p>
<div class="cards two">
  <div><b>Built-in memory</b>Knowledge learned in training and stored in the weights, also called <b>parametric memory</b>. It is general, fixed at release, and may be out of date or wrong on details.</div>
  <div><b>Working memory</b>Everything in the window: the context. It is temporary and gone when the chat ends. It is specific and current, but the window has a limit.</div>
</div>
<p>Anything the model could not have learned in training has to be in its working memory.</p>`,
      interactive: host => { host.append(h("p", { text: "Where does each piece of knowledge live?" })); const w = h("div", { class: "widget" }); host.append(w); sorter(w, SORT1, ["Built-in memory", "Working memory"]); },
      deep: `<p>Giving the model everything it might need is sometimes called context stuffing. It works, but it runs into the window limit and the cost of every token.</p>
<p>Further reading: <a href="https://academy.claude.com/tutorials/parametric-memory-and-context" target="_blank" rel="noopener">Claude Academy, how context affects Claude’s performance and cost</a>.</p>`,
      quiz: [["Which of these has to be in working memory, not built-in memory?", ["The customer’s order status", "How to write polite English", "What a refund is"], 0, "The model could not have learned a specific, current fact in training, so it has to be supplied."]]
    },
    {
      title: "The picture: what goes into the context",
      main: host => {
        host.append(h("p", { text: "Many layers are sent in with every request. The model reads all of them, inside a window of limited size, and then writes one token. That token joins the context, and the model reads it all again." }));
        host.append(h("div", { class: "loop" }, h("div", { class: "lp" }, h("span", { text: "1" }), "Everything is sent in", h("small", { class: "hint", text: "instructions, skills, notes, documents, the chat, tool results, your request" })), h("i", { text: "→" }), h("div", { class: "lp on" }, h("span", { text: "2" }), "The model reads its working memory", h("small", { class: "hint", text: "a window of limited size" })), h("i", { text: "→" }), h("div", { class: "lp" }, h("span", { text: "3" }), "It writes the next token", h("small", { class: "hint", text: "which joins the context" })), h("i", { text: "↺" }), h("div", { class: "lp back" }, h("span", { text: "↺" }), "Read it all again")));
      },
      interactive: host => { host.append(h("p", { text: "Click a layer to see what it is, an example, and who controls it. The colour shows who supplies it." })); picture(host, true); },
      deep: `<p>The layers change from product to product. Some have no memory, no skills or no retrieval. The colours show who supplies each layer: the product builder, a lookup done for you, you, or the model itself.</p>
<p>The product wraps the model (Lesson 4). Nothing in the context changes the weights.</p>`,
      quiz: [["Who supplies the system instructions?", ["The customer", "The model itself", "The product builder"], 2, "Standing rules come from whoever builds or configures the product around the model."]]
    },
    {
      title: "The window fills up",
      main: `<p>The window has a fixed size. The fixed layers use space first. Then every message and every reply is added, and all of it is sent again with the next message.</p>
<p>So a long chat fills the window, and costs more with each message, because every token sent in is counted.</p>`,
      interactive: fillInit,
      deep: `<p>Real windows are far larger than this toy one, but the same thing happens. When a chat gets long, a product can summarize it (this is called compaction), which frees space but can lose details. Some tools also save notes for later chats; Claude Code reads a CLAUDE.md file, for example.</p>
<p>Source: <a href="https://academy.claude.com/tutorials/parametric-memory-and-context" target="_blank" rel="noopener">Claude Academy</a>.</p>`,
      quiz: [["Why can a short question late in a long chat cost more than the same question in a new chat?", ["Short questions are harder to answer", "Every message sends the whole earlier conversation again", "The model charges for politeness"], 1, "The whole context is sent each time, so a longer chat means more tokens per message."]]
    },
    {
      title: "Change the context, change the answer",
      main: `<p>The question stays the same. What changes is what the model can see.</p>
<p>Switch layers on and off and watch the reply move.</p>`,
      interactive: toggleInit,
      deep: `<p>Missing context is one of the most common causes of a vague or wrong answer. When a reply is poor, check first whether the model had the facts it needed.</p><p>This demo uses simple rules. A real model also uses what it learned in training, and can weigh the facts differently or get them wrong.</p>`,
      quiz: [["Why did the reply become vague when the policy document was switched off?", ["Documents make replies shorter", "The model got tired", "The model had no source for the policy and could only guess"], 2, "The model can only use what it was given, plus what it learned in training. Your policy was in neither."]]
    },
    {
      title: "Attention in one idea",
      main: `<p>With all that text in the window, the model needs to decide which parts matter for the token it is writing. This is called <b>attention</b>.</p>
<p>When it reads a word, it looks back at earlier words and gives each a weight. In Try it, compare two versions of the same request.</p>
<p>You cannot set attention yourself, but you can make it easier for the model to land on the right words:</p>
<div class="cards three">
  <div><b>Be specific</b>Say exactly what you want and which facts matter.</div>
  <div><b>Name things</b>Write “the return policy”, not “it” or “that”. Clear links are easier to follow.</div>
  <div><b>Cut the noise</b>Remove old or irrelevant text so the important parts stand out.</div>
</div>`,
      interactive: attInit,
      deep: `<p>Where you put key facts can matter too. Very long inputs can have parts that get less weight, and models differ, so test with your own material (see the next steps).</p>
<p>The weights here are hand-set to illustrate the idea. Real models learn them, run many patterns in parallel and stack them in many layers. A word can only look at earlier words, so later words are dimmed. The toy model in Lesson 4 looks only at the last token.</p>`,
      quiz: [["In one sentence, what does attention do?", ["It stores the customer’s account", "It lets the model weigh which earlier words matter for the word it is working on", "It decides the temperature"], 1, "Attention is how the model uses relationships between words in the context."]]
    },
    {
      title: "Long inputs and overlooked details",
      main: `<p>More context is not always better. A detail buried in a very long input can be overlooked, and every token costs money.</p>
<p>Clear, specific, relevant context works best.</p>`,
      interactive: host => { host.append(h("p", { text: "Does each habit help the model, or get in its way?" })); const w = h("div", { class: "widget" }); host.append(w); sorter(w, SORT6, ["Helps the model", "Gets in the way"]); },
      deep: `<p>How well a model uses a long input varies by model and by task, so test with your own material instead of assuming.</p>`,
      quiz: [["Your input is very long. What is a good habit?", ["Hide the key fact in the middle", "State the key facts clearly and remove irrelevant text", "Repeat everything three times"], 1, "Less noise makes the facts that matter easier to use, and it costs less."]]
    },
    {
      title: "Getting the right facts in",
      main: `<p>In step 4 you switched the policy document on yourself. In many products, retrieval (RAG) does it for you: it searches your documents and adds the best-matching passages. The window is limited, so only a few fit.</p>
<p>Either way, the idea is the same: the model answers from what is in its context. Compare two cases for the same question:</p>
<div class="cards">
  <div><b>Not provided</b>The model has no policy text, so it fills the gap from general memory and may make up details.</div>
  <div><b>Provided</b>The policy is in the context, so the model answers from it. This is called grounding.</div>
</div></div>`,
      interactive: ragInit,
      deep: `<p><b>Grounding</b> means tying the answer to source material you supply. It keeps the reply tied to your own sources, instead of the model’s general memory. You can supply it by pasting or attaching the text, or a product can retrieve it for you. You can also tell the model to answer only from the documents and to say when it cannot find the answer.</p>
<p>Behind the scenes, whoever builds the search decides how documents are split and kept up to date (Lesson 8). Some products let the model decide to search for itself, using a tool, before it answers. This is sometimes called agentic context. It costs more tokens, but it can find facts that were not in the context to begin with. Lesson 8 covers how a business sets this up.</p>`,
      quiz: [["You need the model to quote your return policy correctly. What helps most?", ["Hope the model remembers it", "Put the policy text in the context", "Ask the same question again"], 1, "Without the text in the context the model can make up details. With it, the model can answer from the source."]]
    },
    {
      title: "What you’ve seen",
