<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Model usage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../assets/css/site.css"></head><body>
<header id="site-head"></header>
<main class="col" id="lesson"></main>

<script>
const M = loadModel(new Tiny());
if (M.steps < 200) M.train(2000, 0.5);
const S = { prompt: "the customer returned the product because", gen: [], T: 1, picked: null, r: null, rev: {}, ctx: 0, ck: 0 };
const pw = () => S.prompt.split(" ");
const words = () => pw().concat(S.gen);
const last = () => { const w = words(); return w[w.length - 1]; };
const done = () => last() === "." || words().length >= 18;

    h("div", { class: "label", text: "Added by the product: instructions" }), h("div", { class: "docbox", text: "You are a support assistant for a retailer. Follow the returns policy. Be polite and brief." }),
    h("div", { class: "label", text: "Added by the product: documents and chat so far" }), h("div", { class: "docbox", text: "Returns policy: 30 days, unused items. Earlier: the customer says the product arrived damaged." }),
    h("div", { class: "label", text: "Your request" }), h("div", { class: "docbox", text: S.prompt.replace(/^./, c => c.toUpperCase()) + "…" }));
  x.append(h("p", { class: "hint", text: "The toy model in the next steps follows only your own words." }));

function r4() {
  const x = clear($("#x4")); x.append(h("div", { class: "label", text: "Tokens" }), promptLine(), go(4, "Split into tokens"));
  if (S.rev[4]) { const t = tokenize(words().join(" ")), b = tokChips(t); [...b.children].forEach((c, i) => { c.classList.add("pop"); c.style.animationDelay = i * 90 + "ms"; }); x.append(b, h("p", { class: "hint", text: t.length + " tokens. A dot marks a space that belongs to the token after it." })); }
}
const emb = id => [0, 1, 2, 3].map(k => ((id * 37 + k * 91 + 13) % 200) / 100 - 1);
function r5() {
  const x = clear($("#x5")); x.append(h("div", { class: "label", text: "Tokens to numbers" }), promptLine(), go(5, "Turn tokens into numbers"));
  if (S.rev[5]) {
    const w = words(), tb = h("table", { class: "cmpt" }, h("tr", null, ...["Token", "ID", "List of numbers"].map(t => h("th", { text: t }))));
    w.slice(-5).forEach(t => tb.append(h("tr", null, h("td", { style: { fontWeight: 600 }, text: t }), h("td", { text: "#" + VI[t] }), h("td", { text: "[ " + emb(VI[t]).map(v => v.toFixed(2)).join(", ") + ", … ]" }))));
    x.append(h("div", { style: { overflow: "auto" } }, tb), h("p", { class: "hint", text: "Showing the last five tokens. The lists are illustrative, and real models use thousands of numbers per token." }));
  }
}
function r6() {
  const x = clear($("#x6")); x.append(h("div", { class: "label", text: "Attention on the last token" }), promptLine(), go(6, "Show where the model looks"));
  if (S.rev[6]) { const w = words(), n = w.length; x.append(bars(w.map((t, i) => ({ label: t, p: i === n - 1 ? 1 : 0, cls: i === n - 1 ? "hit" : "" })), { max: 1 }), h("p", { class: "hint", text: "All of this tiny model’s attention goes to the last token." })); }
}
function r7() {
  const x = clear($("#x7")); x.append(h("div", { class: "label", text: "Odds for the next token" }), promptLine());
  if (done()) { x.append(finished()); return; }
  x.append(go(7, "Score every next token"));
  if (S.rev[7]) { const { p1, order } = dist(1); x.append(h("p", { class: "hint", text: "After “" + dispW(VI[last()]) + "”" }), bars(order.slice(0, 6).map(k => ({ label: dispW(k), p: p1[k] })))); }
}
function r8() {
  const x = clear($("#x8")); x.append(promptLine());
  if (done()) { x.append(finished()); return; }
  const { p1, pT, order } = dist(S.T), pk = S.picked;
  const lab = h("b", { text: S.T.toFixed(1) }), sl = h("input", { type: "range", min: 0, max: 2, step: 0.1, value: S.T, id: "tm", "aria-label": "Temperature" });
  sl.oninput = () => { S.T = parseFloat(sl.value); S.picked = null; r8(); r10(); };
  x.append(h("label", { class: "field", for: "tm" }, h("span", null, "Temperature: ", lab, " (0 always takes the top token)"), sl));
  const top = order.slice(0, 5); if (pk != null && !top.includes(pk)) top.push(pk);
  x.append(bars(top.map(k => ({ label: dispW(k), p: pT[k], ghost: p1[k], cls: k === pk ? "hit" : "" })), { max: Math.max(pT[order[0]], p1[order[0]]) }));
  const dart = h("div", { class: "dart", "aria-hidden": "true" }); let acc = 0;
  order.slice(0, 8).forEach((k, i) => { acc += pT[k]; dart.append(h("div", { title: dispW(k) + " " + pct(pT[k]), style: { width: pT[k] * 100 + "%", opacity: i % 2 ? 0.6 : 1, background: k === pk ? "var(--good)" : "var(--accent)" } })); });
  if (acc < 0.999) dart.append(h("div", { style: { width: (1 - acc) * 100 + "%", background: "var(--muted)", opacity: 0.35 } }));
  if (pk != null && S.r != null) dart.append(h("div", { class: "m", style: { left: S.r * 100 + "%" } }));
  x.append(dart);
  if (pk == null) x.append(h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => { const [k, r] = pick({ order, pT }, S.T); S.picked = k; S.r = r; r8(); } }, "Roll the dice")));
  else x.append(h("p", { class: "hint", text: S.r != null ? "The random number " + S.r.toFixed(2) + " landed in the slice for “" + dispW(pk) + "”." : "At temperature 0 the top token always wins: “" + dispW(pk) + "”." }), h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => { S.gen.push(VOCAB[pk]); S.picked = null; S.rev = {}; renderAll(); } }, "Add “" + dispW(pk) + "” to the text"), h("button", { class: "btn", onclick: () => { S.picked = null; r8(); } }, "Roll again")));
}
function r9() {
  const x = clear($("#x9")); x.append(promptLine());
  const one = () => { if (done()) return; const d = dist(S.T); S.gen.push(VOCAB[pick(d, S.T)[0]]); };
  x.append(h("div", { class: "row" }, h("button", { class: "btn primary", disabled: done(), onclick: () => { one(); S.picked = null; S.rev = {}; renderAll(); } }, "Add one more token"), h("button", { class: "btn", disabled: done(), onclick: () => { let n = 0; while (!done() && n++ < 20) one(); S.picked = null; S.rev = {}; renderAll(); } }, "Write the whole reply"), h("button", { class: "btn", onclick: () => reset() }, "Start over")));
  x.append(h("p", { class: "hint", text: S.gen.length + " tokens added so far, at temperature " + S.T.toFixed(1) + "." + (done() ? " The reply is complete." : "") }));
}
function r10() {
  const x = clear($("#x10"));
  const out = h("div", { class: "out-list" });
  x.append(h("p", { class: "hint", text: "Uses the request from the Send step and the temperature from the Pick step (now " + S.T.toFixed(1) + ")." }), h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => {
    const runs = {}; for (let k = 0; k < 10; k++) { const s = generate(M, pw(), S.T).join(" "); runs[s] = (runs[s] || 0) + 1; }
    const ent = Object.entries(runs).sort((a, b) => b[1] - a[1]); clear(out).append(h("p", { class: "hint", text: ent.length + " different " + (ent.length === 1 ? "reply" : "replies") + " out of 10" })); ent.slice(0, 5).forEach(([s, n]) => out.append(h("div", null, h("b", { text: "×" + n }), h("span", { text: s }))));
    if (ent.length > 5) out.append(h("p", { class: "hint", text: "…and " + (ent.length - 5) + " more." }));
  } }, "Run it 10 times")), out);
}
function r11() {
  const x = clear($("#x11"));
  if (!S.gen.length) { x.append(h("div", { class: "empty", text: "There is no reply yet." }), h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => { S.gen = generate(M, pw(), S.T).slice(pw().length); renderAll(); } }, "Write a reply")), h("p", { class: "hint", text: "Or build one token by token in the Repeat step." })); return; }
  x.append(h("div", { class: "label", text: "Output tokens" }), tokChips(S.gen.map(t => ({ t, id: "#" + VI[t] }))), go(11, "Join into text"));
  if (S.rev[11]) x.append(h("div", { class: "label", text: "What you see" }), h("div", { class: "docbox", text: (pw().join(" ") + " " + S.gen.join(" ")).replace(" .", ".").replace(/^./, c => c.toUpperCase()) }), h("div", { class: "row" }, h("button", { class: "btn sm", onclick: () => reset() }, "Start over")));
}
const CK = [["Draft reply", "A person reads the draft, edits it and sends it.", "Draft only", "good"], ["Small refund", "The refund is inside the limit the firm set, so the product issues it and logs it.", "Automatic", "good"], ["Large refund", "The refund is above the limit, so the product waits for a person to approve it.", "Needs approval", "info"], ["Policy breach", "A guardrail catches text that breaks policy, blocks it and asks for a new reply.", "Blocked", "warn"]];
function ckInit(host) {
  hostOf(host, `<div class="widget"><div class="label">The model has written its reply to the customer who returned a damaged product. What does the product do next?</div><div class="row"><div class="seg3" id="ck-seg"></div></div><div class="note" id="ck-note"></div><p class="hint">The limits here are examples. Each firm sets its own.</p></div>`);
  seg("#ck-seg", CK.map(c => c[0]), 0, i => { const c = CK[i]; $("#ck-note").replaceChildren(h("b", { text: c[2] + ". " }), c[1]); });
}
function renderAll0() { r2(); r3(); r4(); r5(); r6(); r7(); r8(); r9(); r10(); r11(); }
const renderAll = () => keepView(renderAll0);

lesson({
  title: "Model usage",
  lede: "Using a model is the second half of the story. Lesson 3 ended with a frozen assistant model. Here a request goes in, the model works through it, and a reply comes out. You will follow one request through three stages, using the toy model from Lesson 3.",
  learn: `<b>By the end you can</b>trace a request from typed text to reply, explain why the same request can get different replies, and say which parts of the process you control.`,
  steps: [
    {
      title: "The journey of a request",
      main: `<p>A request goes through three stages. The model sits inside a <b>product</b>: the app or tool you actually use, such as a chat app or your company’s assistant. In Try it, click any box to see what happens there.</p>
<div class="pbands">
  <div class="pband b1"><div class="phead"><b>Stage 1 · Prepare the input</b><span>You and the product</span></div>
    <p class="small" style="margin:6px 0">You send a request, the product adds context, the text is tokenized, and the tokens become numbers.</p>
    <div class="pres"><span class="parr">→</span><b>Numbers:</b> a sequence the model can compute with.</div></div>
  <div class="pband b2"><div class="phead"><b>Stage 2 · The model generates</b><span>The frozen model</span></div>
    <p class="small" style="margin:6px 0">The model reads the context, scores every next token, picks one, and repeats.</p>
    <div class="pres"><span class="parr">→</span><b>Output tokens:</b> the reply, one token at a time.</div></div>
  <div class="pband b3"><div class="phead"><b>Stage 3 · Deliver the output</b><span>The product</span></div>
    <p class="small" style="margin:6px 0">The tokens become text (or an image, or a sound), and the product checks and delivers the reply.</p>
    <div class="pres"><span class="parr">→</span><b>A reply or an action:</b> what you see, or what the product does.</div></div>
</div>`,
      interactive: host => { hostOf(host, `<div class="widget" id="pipe"></div>`); pipeline("#pipe", "infer"); },
      deep: `<p>Nothing in this journey changes the model. Its parameters were frozen at release (Lesson 3), so using it does not teach it anything. Whether a vendor may use your chats to train a later version depends on its settings and contract.</p>`,
      quiz: [["Does using a model change the model?", ["Yes, it learns from every request", "No. The parameters are frozen, and it only reads them", "Yes, but only at night"], 1, "Using a model is inference: it reads the frozen parameters. Learning happens only when the vendor trains a new version."]]
    },
    {
      stage: "Stage 1",
      title: "You send a request",
      main: `<p>Everything starts with your request. Text is the simplest kind. Images, audio and files can be sent too.</p>
<p>We will follow one request through the whole lesson: <b>“the customer returned the product because…”</b>. The model’s job is to continue it.</p>
<p>To the model, the request is its whole view of the world. It knows nothing else about you or your situation.</p>`,
      interactive: mk("x2"),
      deep: `<p>Images and audio are cut into small pieces, such as patches of an image or short slices of sound, and turned into numbers. After that, the rest of the process is much the same as for text.</p>`,
      quiz: [["Apart from the request and what the product adds, what does the model know about the customer’s situation?", ["Their order history", "Nothing else", "How they are feeling"], 1, "Anything you want the model to use has to be in what it receives. This is why context matters so much."]]
    },
    {

      title: "The product adds context",
      main: `<p>The model is one part of a <b>product</b>, which is the app or tool you actually use: a chat app, an editor plug-in, your company’s assistant. Before your request reaches the model, the product wraps it. It adds standing instructions, the conversation so far, and any documents it looked up.</p>
<p>This is why the same model behaves differently in different products.</p>`,
      interactive: mk("x3"),
      deep: `<p>All of this added text counts toward cost and speed, and it competes for space in the context window (Lesson 5). Old or missing documents lead to out-of-date answers.</p>`,
      quiz: [["Why can two products built on the same model behave differently?", ["Each product adds its own instructions and documents", "Each one has a different alphabet", "The model changes mid-sentence"], 0, "The wrapper text a product adds shapes the reply, even when the model underneath is the same."]]
    },
