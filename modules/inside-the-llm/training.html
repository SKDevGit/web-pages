function r1() {

  const sel = h("select", { id: "sent", "aria-label": "Training sentence", onchange: e => { S.s = +e.target.value; S.cur = null; renderAll(); } });
  UNIQ.forEach(i => sel.append(h("option", { value: i, text: CORPUS[i].replace(" .", "."), selected: i === S.s })));

  x.append(h("div", { class: "row" }, h("button", { class: "btn", onclick: () => { const d = M.draw(); S.s = d.s; pickWord(d.pos); } }, "Or draw a random example")));
}
function r2() {

}
function r3() {

    if (S.revealed) {
      const p = S.before[S.cur.j], sc = -Math.log(p), w = dispW(S.cur.j);
      const lv = sc < 0.7 ? ["good", "Low score: the model was fairly sure"] : sc < 2 ? ["info", "Medium score: the model gave it some chance"] : ["warn", "High score: the model was surprised"];
      x.append(h("div", { class: "label", style: { marginTop: "10px" }, text: "The model’s chances for the next word" }), bars(topRows(S.before, 5, S.cur.j, null, S.cur.j)), h("p", { class: "hint", text: "The highlighted bar is the real word." }),
        h("div", { class: "note" }, h("p", { style: { margin: "0 0 6px" } }, "The real next word was “" + w + "”. The model gave it " + pct(p) + ", so the error score is ", h("b", { text: sc.toFixed(2) }), "*."), h("span", { class: "pill " + lv[0], text: lv[1] }), h("div", { class: "track", style: { marginTop: "10px" } }, h("i", { style: { width: Math.min(100, sc / 5 * 100) + "%" } })), h("div", { class: "hint", style: { display: "flex", justifyContent: "space-between" } }, h("span", { text: "0: sure and right" }), h("span", { text: "5 or more: very surprised" }))));
    }

}
function r3b() {

function r4() {

function r8() {

  const unif0 = 0;

  const unif = new Array(V).fill(1 / (V - 1)); unif[0] = 0;

    h("label", { class: "field", for: "ask-sel" }, "After the word", sel));

function renderAll0() { r1(); r2(); r3(); r3b(); r4(); r5(); r8(); }

function hostOf(host, html) { host.innerHTML = html; }

</div>`);

function tsInit(host) {

  <div class="stack" id="ts-list"></div>

lesson({
  title: "Model development",
  lede: "Building a model is like a manufacturing process: raw material goes through a line of stations, is finished and tested, then is packaged for customers. This lesson walks the line in three stages, and runs the first stage on a toy model small enough to see.",
  learn: `<b>By the end you can</b>name the three stages of model development, describe the training loop and the error score, and say how a base model becomes an assistant and then a product.`,
  steps: [
    {
      title: "The production line",
      main: `<p>A model is made on a line with three stages. Each stage hands a better part to the next. In Try it, click any box to see what happens there.</p>
<div class="pbands">
  <div class="pband b1"><div class="phead"><b>Stage 1 · Build the base model</b><span>Make the raw part</span></div>
    <p class="small" style="margin:6px 0">Collect text, clean and filter it, tokenize it, then pre-train.</p>
    <div class="pres"><span class="parr">→</span><b>Base model:</b> a file of numbers that continues text. It does not answer requests.</div></div>
  <div class="pband b2"><div class="phead"><b>Stage 2 · Fine-tune and polish</b><span>Finish and test</span></div>
    <p class="small" style="margin:6px 0">Fine-tune on examples, learn from human feedback, test and release.</p>
    <div class="pres"><span class="parr">→</span><b>Assistant model:</b> frozen and ready to answer. This is the model that inference uses.</div></div>
  <div class="pband b3"><div class="phead"><b>Stage 3 · Package as a product</b><span>Package and ship</span></div>
    <p class="small" style="margin:6px 0">Add instructions, an interface, safety checks and sometimes tools.</p>
    <div class="pres"><span class="parr">→</span><b>A product:</b> what people actually use at work.</div></div>
