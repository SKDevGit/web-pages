<script>
/* scripted data for the demos */
const MS = [["Return request", "Hi, order 4821 arrived with a cracked screen. I need a refund before Friday, I’m traveling.", "Refund request", "Order 4821 · cracked screen · deadline Friday", "High"], ["Question", "Does the extended warranty cover accidental damage? Thinking of buying the Pro model.", "Pre-sale question", "Product: Pro model · topic: warranty", "Low"], ["Complaint", "This is the third time my delivery is late. Nobody replies to my emails. Very disappointed.", "Complaint", "Issue: late delivery (3rd time) · no reply", "Medium"]];
const ORIG = "Your refund is approved. It will reach your account in 5 days.";
const RW = [["Formal", "We are pleased to confirm that your refund has been approved. Please allow five days for it to appear in your account."], ["Friendly", "Good news, your refund is approved. It should be in your account within about 5 days."], ["Shorter", "Refund approved. Arrives in 5 days."], ["Spanish", "Su reembolso ha sido aprobado. Llegará a su cuenta en 5 días."], ["Hindi", "आपका रिफ़ंड स्वीकृत हो गया है। यह 5 दिनों में आपके खाते में पहुँच जाएगा।"]];
const TH = ["Customer: My laptop arrived with a cracked screen on Monday.", "Agent: Sorry to hear that. Can you send a photo and your order number?", "Customer: Photo attached. Order 4821.", "Agent: Thanks. It is under warranty, so we can replace it or refund it. Which do you prefer?", "Customer: A refund please. I need it before Friday for a trip.", "Agent: Approved. The refund of $240 will arrive in 5 business days."];
const SM = [["One line", "Cracked laptop (order 4821): refund approved, $240, arriving in 5 business days."], ["Three bullets", "• Laptop arrived cracked, order 4821\n• Under warranty; customer chose refund\n• $240 approved, arrives in 5 business days"], ["Full thread", TH.join("\n")]];
const wc = s => s.trim().split(/\s+/).length;
const DOC = ["Returns are accepted within 30 days of delivery.", "Opened items carry a 15% restocking fee.", "Refunds are paid to the original payment method in 5 business days.", "Final-sale items cannot be returned."];
const QS = [["How long do I have to return something?", 0, "You have 30 days from delivery."], ["Is there a fee on opened items?", 1, "Yes, 15% of the price."], ["Do you ship to Canada?", -1, "The document does not say. Please check with the support team.", "Many online stores ship abroad, so probably yes."]];
const CR = [["Text", "“Write a polite reply declining a late return.”", "A full draft email in your tone", "The LLM itself, one token at a time", "Marketing copy, reports, emails"], ["Code", "“Write a spreadsheet formula that adds the restocking fee.”", "Working formula or script", "The LLM itself. Code is just text with strict rules", "Analysis scripts, automations, quick prototypes"], ["Image", "“A flat illustration of a returned parcel.”", "A picture", "A separate image model. An LLM may write or refine the prompt", "Campaign visuals, mock-ups, product images"], ["Audio", "“Read this notice in a calm voice.”", "Speech or music", "A speech or audio model. An LLM can write the script", "Voice-overs, support lines, training audio"], ["Video", "“A short clip of a parcel arriving.”", "Short moving images", "A video model. An LLM can write the storyboard", "Ads, explainers, product demos"]];
const RS = ["Three items: $80, $45, $120. Total $245.", "Items 2 and 3 were opened, so the 15% fee applies to them: 45 + 120 = $165.", "Fee = 15% of $165 = $24.75.", "Refund = $245 − $24.75 = $220.25.", "Check: item 1 in full ($80) + opened items less 15% ($140.25) = $220.25. ✓"];
const AG = [["Goal", "Goal: resolve ticket #4821, “laptop arrived cracked”.", "t"], ["Plan", "Plan: 1) look up the order, 2) check the warranty, 3) draft a refund, 4) get approval.", "t"], ["Tool: order lookup", "Tool call → orders.find(4821)\nResult ← $240 laptop, delivered Monday, under warranty", ""], ["Decide", "Decision: warranty applies, refund is allowed.", "t"], ["Tool: draft refund", "Tool call → refund.prepare($240)\nResult ← waiting for approval (over $200)", ""], ["Human check", "Human: approves. Agent sends the customer an email and closes the ticket.", "h"]];
const HOODS = {};
function hood(id, prompt, seq, why) { HOODS[id] = { prompt, seq, why }; }
hood("#h1", "Email: “Order 4821 arrived with a cracked screen. I need a refund before Friday.”\nCategory:", [[" Refund", [[" Refund", .78], [" Complaint", .12], [" Question", .06]]], [" request", [[" request", .9], [" order", .04]]], ["\n", [["\n", .85], [".", .08]]], ["Order", [["Order", .7], ["Item", .2]]], [":", [[":", .95]]], [" 4821", [[" 4821", .93], [" 4812", .02]]]], "Training text is full of labeled lists, so after “Category:” the likely next token is a label. The order number is copied because attention points at the “4821” already in the email. Labeling and extracting are just continuing a familiar pattern.");
hood("#h2", "Original: Your refund is approved. It will reach your account in 5 days.\nIn Spanish:", [[" Su", [[" Su", .62], [" Tu", .2], [" El", .08]]], [" reembolso", [[" reembolso", .8], [" devolución", .12]]], [" ha", [[" ha", .72], [" fue", .15]]], [" sido", [[" sido", .96]]], [" aprobado", [[" aprobado", .9], [" autorizado", .05]]], [".", [[".", .82], [",", .12]]]], "The training text had countless sentences placed beside their translations. After “In Spanish:” the likeliest continuation is the same meaning in Spanish. Meaning carries across because words with the same sense, such as “refund” and “reembolso”, get similar embeddings.");
hood("#h3", "Thread:\nCustomer: My laptop arrived with a cracked screen. Order 4821.\nAgent: We can replace it or refund it.\nCustomer: A refund please, before Friday.\nAgent: Approved. $240 in 5 business days.\n\nIn one line:", [[" Cracked", [[" Cracked", .34], [" Customer", .22], [" Laptop", .15]]], [" laptop", [[" laptop", .5], [" screen", .3]]], [" refunded", [[" refunded", .38], [" replaced", .2], [" returned", .15]]], [":", [[":", .35], [" for", .25], [" (", .2]]], [" $240", [[" $240", .7], [" 240", .1]]], [".", [[".", .6], [" in", .2]]]], "Attention lets each new word look back across the whole thread and give more weight to the key facts: cracked, refund, $240. Training text is full of headlines, abstracts and “TL;DR” lines, which taught the model what usually gets kept and what is dropped.");
hood("#h4", "Policy: Returns are accepted within 30 days of delivery. Opened items carry a 15% restocking fee.\nQuestion: How long do I have to return something?\nAnswer: You have", [[" 30", [[" 30", .92], [" 14", .03], [" 60", .02]]], [" days", [[" days", .97]]], [" from", [[" from", .8], [" after", .12]]], [" delivery", [[" delivery", .9], [" purchase", .06]]], [".", [[".", .9]]]], "The odds for “30” are very high because attention points at “30 days” in the policy that is in the prompt. If you remove the policy, “30” becomes one guess among many: “14”, “60”, “30” are all plausible. That is why supplying the document changes the answer.");
hood("#h5", "Write a polite reply declining a late return.\nReply:", [[" Dear", [[" Dear", .42], [" Hi", .25], [" Hello", .18]]], [" customer", [[" customer", .38], [" Ms", .12], [" Sir", .1]]], [",", [[",", .8], ["!", .05]]], ["\n", [["\n", .9]]], ["Thank", [["Thank", .55], ["We", .2], ["I", .15]]], [" you", [[" you", .95]]]], "Creative writing is the same loop with more choice: many tokens are plausible, and the model samples among them (Lesson 4), so each run differs. Temperature sets how adventurous it is. Some image and video models also produce pieces one after another; others start from noise and clean it up step by step. Either way they learn their patterns from huge numbers of examples.");
hood("#h6", "Q: Items cost $80, $45 and $120. Items 2 and 3 were opened, with a 15% fee. What is the refund?\nLet’s work step by step.\nStep 1:", [[" Total", [[" Total", .5], [" Add", .25], [" The", .15]]], [" the", [[" the", .4], [" is", .3]]], [" items", [[" items", .6]]], [":", [[":", .5], [" =", .3]]], [" $245", [[" $245", .82], [" $235", .04], [" $255", .03]]], [".", [[".", .7]]]], "Writing the steps first puts each intermediate result, such as $245, into the text. The next token can then use it. Without steps the model must produce the final number in one jump, which is where slips creep in. Reasoning here is written work, one token at a time.");
hood("#h7", "Goal: resolve ticket #4821, “laptop arrived cracked”.\nTools: orders.find(id), refund.prepare(amount)\nNext action:", [[" orders", [[" orders", .72], [" refund", .18]]], [".", [[".", .96]]], ["find", [["find", .93]]], ["(", [["(", .98]]], ["4821", [["4821", .85], ["4812", .03]]], [")", [[")", .97]]]], "The model’s output is text shaped like a tool call. A normal program reads that text, runs the tool, and pastes the result back into the prompt. Then the model predicts the next action. The model never “does” anything itself: it writes, and software acts on what it writes.");
const THR = "Customer: My laptop arrived with a cracked screen. Order 4821.\nAgent: We can replace it or refund it.\nCustomer: A refund please, before Friday.\nAgent: Approved. $240 in 5 business days.\n\n";
const HD = [["No instruction", "", [["Customer", [["Customer", .46], ["Agent", .22], ["Thanks", .1]]], [":", [[":", .96]]], [" Thank", [[" Thank", .5], [" Great", .15], [" Can", .1]]], [" you", [[" you", .93]]]], "With no instruction there is nothing to steer it, so it just continues the conversation: the likeliest next text. A base model behaves like this all the time. An assistant has been trained to treat your text as a request."],
["Summarize in one line", "In one line:", [[" Cracked", [[" Cracked", .34], [" Customer", .22], [" Laptop", .15]]], [" laptop", [[" laptop", .5], [" screen", .3]]], [" refunded", [[" refunded", .38], [" replaced", .2]]], [":", [[":", .35], [" for", .25]]]], "After “In one line:” the likeliest text is a short version of the thread, so the odds favor its key facts. Attention connects each new word back to the thread."],
["Translate to Spanish", "Translate to Spanish:", [["\n", [["\n", .6], [" Cliente", .2]]], ["Cliente", [["Cliente", .55], ["El", .15]]], [":", [[":", .92]]], [" Mi", [[" Mi", .62], [" El", .12]]]], "Text that follows a translation cue is the same meaning in the other language, so the odds jump to Spanish words, even though the thread itself is in English."],
["List the action items", "List the action items:", [["\n", [["\n", .72]]], ["1", [["1", .62], ["-", .2], ["•", .1]]], [".", [[".", .9]]], [" Issue", [[" Issue", .5], [" Send", .2], [" Process", .15]]], [" a", [[" a", .55]]], [" refund", [[" refund", .8]]]], "A list cue makes a numbered list the likely start. The items come from the facts in the thread, found by attention."],
["Is the customer satisfied?", "Is the customer satisfied? Answer:", [[" Yes", [[" Yes", .62], [" No", .18], [" Probably", .1]]], [",", [[",", .42], [".", .4]]], [" the", [[" the", .5], [" they", .2]]], [" refund", [[" refund", .45], [" customer", .3]]]], "A question followed by “Answer:” makes a short answer likely, and the facts in the thread (an approved refund) tilt the odds toward “Yes”."]];

/* the "under the hood" panel: step through the first tokens the model writes */
function hoodInto(host, key) {
  const { prompt, seq, why } = HOODS[key]; let n = 0;
  const root = h("div", { class: "widget hood" }); host.append(root);
  function draw() {
    clear(root);
    const doc = h("div", { class: "docbox" }, h("div", { style: { whiteSpace: "pre-wrap" } }, prompt, ...seq.slice(0, n).map(t => h("span", { class: "gen", text: t[0] }))));
    root.append(h("div", { class: "label", text: "Under the hood: still next-token prediction" }), h("div", { class: "hint", text: "The text the model receives, and what it has written so far (shaded)" }), doc);
    if (n < seq.length) {
      const cur = seq[n], rest = Math.max(0, 1 - cur[1].reduce((a, b) => a + b[1], 0));
      const rows = cur[1].map((x, k) => ({ label: x[0].replace(/\n/g, "↵") || "·", p: x[1], cls: k === 0 ? "hit" : "" })); if (rest > 0.005) rows.push({ label: "(everything else)", p: rest, cls: "dim" });
      root.append(h("div", { class: "label", text: "Odds for the next token" }), bars(rows, { max: 1 }));
    } else root.append(h("div", { class: "note", text: why }));
    root.append(h("div", { class: "row" }, h("button", { class: "btn primary", disabled: n >= seq.length, onclick: () => { n++; draw(); } }, "Predict next token"), h("button", { class: "btn", disabled: n >= seq.length, onclick: () => { n = seq.length; draw(); } }, "Run to the end"), h("button", { class: "btn", disabled: !n, onclick: () => { n = 0; draw(); } }, "Start again")), h("p", { class: "hint", text: "Scripted odds for illustration. Here the top token is taken each time." }));
  }
  draw();
}
const hoodDeep = key => host => hoodInto(host, key);

/* step 1: same text, different last line */
function cueInit(host) {

  seg("#cu-seg", HD.map(x => x[0]), 1, i => {
    const e = HD[i], th = clear($("#cu-th"));
    th.append(THR.trim(), "\n", h("span", { class: "gen", text: e[1] || "(nothing added)" }), "\n", h("div", { style: { marginTop: "3px" } }, h("span", { class: "hint", text: "Likely start of the reply: " }), h("b", { text: e[2].map(t => t[0].replace(/\n/g, " ")).join("") })));
    const cur = e[2][0][1], rest = Math.max(0, 1 - cur.reduce((a, b) => a + b[1], 0));
    const rows = cur.slice(0, 3).map((x, k) => ({ label: x[0].replace(/\n/g, "↵") || "·", p: x[1], cls: k === 0 ? "hit" : "" }));
    clear($("#cu-bars")).append(bars(rows, { max: 1 }));
    $("#cu-note").textContent = e[3];
  });
}

/* step 2: teach the pattern in the request */
const FS = [
  { n: "No examples", p: "Label this email as Refund request, Complaint or Question.\nEmail: “Does the warranty cover accidental damage?”\nLabel:", ex: "", rows: [[" The", .31], [" This", .18], [" Yes", .14], [" Question", .09]], reply: " The email is asking whether…", note: "The model knows roughly what you want, but the form of the reply is open. Many continuations are plausible, so the answer may not be a clean label." },
  { n: "Two examples", p: "Email: “Order 4821 arrived with a cracked screen.”\nLabel: Refund request\nEmail: “Third late delivery and nobody replies.”\nLabel: Complaint\nEmail: “Does the warranty cover accidental damage?”\nLabel:", ex: 4, rows: [[" Question", .84], [" Refund", .07], [" Complaint", .04]], reply: " Question", note: "The examples set up a pattern, so a label is by far the likeliest next token. The examples sit in the context, not in the training data." }
];
function shotInit(host) {
  host.innerHTML = `<div class="widget"><div class="row"><span class="hint">Teach the pattern in your request:</span><div class="seg3" id="fs-seg"></div></div><div class="docbox" id="fs-p" style="white-space:pre-line;font-size:.84rem;padding:6px 10px"></div><div class="label">Odds for the next token</div><div id="fs-bars"></div><div class="note" id="fs-note" style="margin:0"></div></div>`;
  seg("#fs-seg", FS.map(x => x.n), 1, i => {
    const e = FS[i], d = clear($("#fs-p")), lines = e.p.split("\n");
    lines.forEach((l, k) => { d.append(h("span", { class: e.ex !== "" && k < e.ex ? "gen" : "", text: l }), k < lines.length - 1 ? "\n" : ""); });
    const rest = Math.max(0, 1 - e.rows.reduce((a, b) => a + b[1], 0));
    const rows = e.rows.map((x, k) => ({ label: x[0], p: x[1], cls: k === 0 ? "hit" : "" })); if (rest > 0.005) rows.push({ label: "(everything else)", p: rest, cls: "dim" });
    clear($("#fs-bars")).append(bars(rows, { max: 1 }));
    $("#fs-note").textContent = e.ex === "" ? e.note : "Shaded lines are your examples. " + e.note;
  });
}

/* steps 3 to 9: one widget each */
function sortInit(host) {
  host.innerHTML = `<div class="widget"><div class="row" id="s1-pick"></div><div class="docbox" id="s1-msg"></div><div class="mini" id="s1-out"></div></div>`;
seg("#s1-pick", MS.map(m => m[0]), 0, i => { $("#s1-msg").textContent = MS[i][1]; clear($("#s1-out")).append(cell("Category", MS[i][2]), cell("Key facts pulled out", MS[i][3]), cell("Urgency", MS[i][4])); });
}
function rewriteInit(host) {
  host.innerHTML = `<div class="widget"><div class="label">Original</div><div class="docbox" id="s2-orig"></div><div class="row"><span class="hint">Rewrite as:</span><div class="seg3" id="s2-seg"></div></div><div class="label">Result</div><div class="docbox" id="s2-out"></div><p class="hint">Scripted examples for the demo. A real model produces these on demand for any text.</p></div>`;
$("#s2-orig").textContent = ORIG;
seg("#s2-seg", RW.map(r => r[0]), 1, i => $("#s2-out").textContent = RW[i][1]);
}
function sumInit(host) {
  host.innerHTML = `<div class="widget"><div class="label">Original thread</div><div class="docbox" id="s3-orig" style="font-size:.82rem;padding:6px 10px"></div><div class="row"><span class="hint">Summary length:</span><div class="seg3" id="s3-seg"></div></div><div class="docbox" id="s3-out" style="padding:6px 10px"></div><div class="cmp"><div style="flex:1;min-width:160px"><div class="cbar" id="s3-bar"></div></div><span class="hint" id="s3-stat"></span></div></div>`;
$("#s3-orig").style.whiteSpace = "pre-line"; $("#s3-out").style.whiteSpace = "pre-line"; $("#s3-orig").textContent = TH.join("\n");
seg("#s3-seg", SM.map(s => s[0]), 0, i => { const t = SM[i][1], full = wc(TH.join(" ")), n = wc(t); $("#s3-out").textContent = t; $("#s3-bar").style.width = Math.round(n / full * 100) + "%"; $("#s3-stat").textContent = n + " of " + full + " words kept"; });
}
function docInit(host) {
  host.innerHTML = `<div class="widget"><div class="row"><span class="hint">Document:</span><div class="seg3" id="s4-seg"></div></div><div class="docbox" id="s4-doc"></div><div class="label">Ask</div><div class="row" id="s4-q"></div><div id="s4-ans" class="stack"></div><p class="hint">Scripted. The unsupported answer is the kind of plausible guess a model can make when it has nothing to read.</p></div>`;
let D4 = { on: true, q: 0 };
function r4() {
  const d = clear($("#s4-doc")); if (!D4.on) { d.append(h("div", { class: "hint", text: "(No document supplied.)" })); } else DOC.forEach((l, i) => d.append(h("div", { class: "ln" + (QS[D4.q][1] === i ? " used" : ""), text: l })));
  const q = QS[D4.q], a = clear($("#s4-ans"));

  else a.append(h("div", null, h("span", { class: "pill warn", text: "Unsupported guess" })), h("p", { style: { margin: 0 }, text: q[3] || ("Probably: " + q[2] + " (but this may not match your policy.)") }));
}
$("#s4-q").append(...QS.map((q, i) => h("button", { class: "btn", onclick: () => { D4.q = i; r4(); } }, q[0])));
seg("#s4-seg", ["On", "Off"], 0, i => { D4.on = i === 0; r4(); });
}
function createInit(host) {
  host.innerHTML = `<div class="widget"><div class="row"><div class="seg3" id="s5-seg"></div></div><div class="mini" id="s5-out"></div></div>`;
seg("#s5-seg", CR.map(c => c[0]), 0, i => { const c = CR[i]; clear($("#s5-out")).append(cell("Example prompt", c[1]), cell("What you get", c[2]), cell("Made by", c[3]), cell("Business use", c[4])); });
}
function reasonInit(host) {
  host.innerHTML = `<div class="widget"><div class="docbox" id="s6-prob"></div><div class="stepn" id="s6-steps"></div><div class="row"><button class="btn primary" id="s6-next">Show next step</button><button class="btn" id="s6-reset">Start over</button></div><div class="note" id="s6-note"></div></div>`;
$("#s6-prob").textContent = "A customer returns three items priced $80, $45 and $120. Items 2 and 3 were opened, and opened items carry a 15% fee. What is the refund?";
let N6 = 0;
function r6() { const s = clear($("#s6-steps")); RS.slice(0, N6).forEach((t, i) => s.append(h("div", { class: "fb" + (i === RS.length - 1 ? " good" : i === N6 - 1 ? " acc" : "") }, "Step " + (i + 1) + ": " + t))); $("#s6-next").disabled = N6 >= RS.length; $("#s6-note").textContent = N6 === 0 ? "Nothing written yet." : N6 < RS.length ? "Each line is written token by token, then read back in as context for the next line." : "Writing out the working gives the model room to compute, and lets you check the logic. Even so, verify the arithmetic on anything important."; }
$("#s6-next").onclick = () => { N6++; r6(); }; $("#s6-reset").onclick = () => { N6 = 0; r6(); }; r6();
}
function agentInit(host) {
  host.innerHTML = `<div class="widget"><div class="stepper" id="s7-stepper"></div><div class="docbox log" id="s7-log"></div><div class="row"><button class="btn primary" id="s7-next">Next step</button><button class="btn" id="s7-reset">Start over</button></div><div class="note" id="s7-note"></div></div>`;
let N7 = 0;
function r7() { const l = clear($("#s7-log")), st = clear($("#s7-stepper")); AG.forEach((a, i) => st.append(h("button", { class: i === N7 - 1 ? "on" : i < N7 ? "done" : "", disabled: true }, a[0]))); AG.slice(0, N7).forEach(a => l.style.whiteSpace = "pre-line") ; AG.slice(0, N7).forEach(a => l.append(h("div", { class: a[2], text: a[1] }))); if (!N7) l.append(h("div", { class: "hint", text: "Press Next step to start." })); $("#s7-next").disabled = N7 >= AG.length; $("#s7-note").textContent = N7 === 0 ? "" : N7 < AG.length ? "The model decides each next move after reading what the last tool returned." : "Note where the person sits: the agent can prepare an action, but a human approves the one that moves money."; }
$("#s7-next").onclick = () => { N7++; r7(); }; $("#s7-reset").onclick = () => { N7 = 0; r7(); }; r7();
}

const CHECK = [
  { t: "Labeling thousands of incoming emails by topic", a: 0, why: "A slip is cheap and easy to spot, so checking a sample is enough." },
  { t: "Summarizing an important contract", a: 1, why: "A summary leaves things out, and the missing part may matter, so compare it with the contract." },
  { t: "A reply that quotes your return policy", a: 1, why: "Check the quoted terms against the policy before a customer sees them." },
  { t: "An agent about to send a $240 refund", a: 2, why: "Actions that move money are costly to undo, so a person approves first." }
];

const learned = t => `<p class="learned"><b>Already learned</b>${t}</p>`;

lesson({
  title: "What LLMs are used for",
  lede: "All of these uses come from one skill: predicting the next token. What changes from one to the next is how much the model has to do with the text, and how much a person needs to check the result. This lesson starts with why one skill covers so many tasks, then climbs from the simplest uses to the most demanding.",
  learn: `<b>By the end you can</b>explain how a next-token predictor can do each task, name seven things an LLM does, and match the amount of checking to the task.`,
  steps: [
    {
      stage: "Stage 1: One skill",
      title: "Every task is text to continue",
      main: `<p>In Lesson 4 you saw that the model only ever does one thing: given the text so far, choose the next token. Labeling emails, translating and reasoning do not sound like that. The link is that <b>every task can be written as text that needs continuing</b>.</p>
<div class="flowd" style="margin:6px 0 12px"><div class="fb">Your request</div><span>→</span><div class="fb acc">Text that needs a continuation</div><span>→</span><div class="fb">Next token, again and again</div><span>→</span><div class="fb good">The result</div></div>
