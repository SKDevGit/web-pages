chrome(10);
const GL = [["Core ideas", [["LLM (large language model)", "A model trained on a very large amount of text to predict the next token. A chat assistant is an LLM with an interface wrapped around it.", null, ["prediction.html", "Lesson 1"]], ["Model", "The finished result of training: a program defined by its structure and its parameters. The same model answers every prompt you send it.", null, ["training.html", "Lesson 3"]], ["Parameters (weights)", "The adjustable numbers inside a model. Training sets them, and inference only reads them. Large models have billions of them or more.", "In the training exercise, the parameters are the table of numbers that gives each word its odds.", ["training.html", "Lesson 3"]], ["Neural network", "A structure made of layers of simple calculations, connected by parameters. It learns patterns by having those parameters adjusted.", "The demo model in this module is much simpler than a real neural network: a single table of numbers.", null], ["Transformer", "The design behind most modern LLMs. Its key idea is attention, which lets each token look at the other tokens in the context.", null, ["context-attention.html", "Lesson 5"]]]], ["Text and tokens", [["Prompt", "The text you send to the model: your instructions, your question, and any background facts you include.", "“Should we approve this refund?” plus the customer’s order details is a prompt.", ["inference.html", "Lesson 4"]], ["Token", "A small piece of text the model reads and writes. Common words are often one token. Rare words, long numbers and codes split into several.", null, ["tokens.html", "Lesson 2"]], ["Tokenizer", "The tool that splits text into tokens and turns each into an ID number. It is fixed before training and used for both training and inference.", null, ["tokens.html", "Lesson 2"]], ["Vocabulary", "The full set of tokens a model knows. Real vocabularies run to tens of thousands of tokens or more. The demo model has 35.", null, ["inference.html", "Lesson 4"]], ["Token ID", "The number assigned to a token in the vocabulary. It is only a label, so it says nothing about meaning. Compare with an embedding.", null, ["inference.html", "Lesson 4"]], ["Context window", "The most text, counted in tokens, that the model can consider at one time. It covers your prompt and the reply together.", "A very large set of documents may not fit in one window, and quality can drop on very long inputs.", ["tokens.html", "Lesson 2"]]]], ["Meaning and relationships", [["Embedding", "A list of numbers that represents a token, learned so that tokens used in similar ways get similar numbers. It is the starting point for the model’s calculations. A token ID is only a label, while an embedding carries meaning.", "“Refund” and “reimbursement” end up with similar embeddings.", null], ["Attention", "The mechanism that lets the model weigh which earlier tokens matter for the token it is working on.", "When it reads “defective”, attention leans on “laptop”, not “store”.", ["context-attention.html", "Lesson 5"]], ["Context", "Everything the model can see while it writes: your prompt, any documents you include, the earlier conversation, and the words it has already written.", null, ["context-attention.html", "Lesson 5"]]]], ["Training process", [["Training data", "The text a model learns from. Patterns, facts and biases in the data can all show up in the model’s behavior.", null, ["training.html", "Lesson 3"]], ["Training", "The process of adjusting a model’s parameters so its predictions get better. It happens before the model is used, not each time you send a prompt.", null, ["training.html", "Lesson 3"]], ["Next-token prediction", "The task a language model is trained on: given the tokens so far, give odds for the next one. Writing a whole reply is this task repeated.", null, ["training.html", "Lesson 3"]], ["Error score (loss)", "A number that measures how wrong a prediction was. It is low when the model gave the right token a high chance. Training pushes it down.", null, ["training.html", "Lesson 3"]], ["Learning rate", "How large each adjustment to the parameters is. Too large and training overshoots. Too small and it is slow.", null, ["training.html", "Lesson 3"]], ["Pre-training", "The first, broad round of training on a huge amount of general text. It gives the model general language ability.", null, ["training.html", "Lesson 3"]], ["Fine-tuning", "Extra training on a smaller, specific set of examples, to shape style or behavior for a task. It changes the parameters, which prompting does not.", "Training a model on your company’s past support replies.", null], ["Base model", "A model after pre-training only. It predicts the next token from patterns in its training text, so it simply continues whatever text it is given and does not treat a request as an instruction to follow.", null, ["training.html", "Lesson 3"]], ["Instruction tuning", "Fine-tuning on example requests paired with good answers, so the model learns to follow instructions.", null, ["training.html", "Lesson 3"]], ["RLHF (learning from human feedback)", "A training round where people rank answers and the model is adjusted toward the preferred ones. It shapes tone and helpfulness.", null, ["training.html", "Lesson 3"]]]], ["Inference process", [["Inference", "Using a trained model to produce output. The parameters stay fixed while the model reads your prompt and writes a reply.", null, ["inference.html", "Lesson 4"]], ["Next-token odds (probability)", "The percentage the model gives each possible next token. They add up to 100%.", null, ["inference.html", "Lesson 4"]], ["Sampling", "Choosing the next token by a weighted random draw from the odds, instead of always taking the top one.", null, ["inference.html", "Lesson 4"]], ["Temperature", "A setting for how adventurous sampling is. Low is predictable. High is more varied. At 0 the top token is always chosen.", null, ["inference.html", "Lesson 4"]], ["Autoregressive generation", "Writing output one token at a time, feeding each new token back in as input for the next one.", null, ["inference.html", "Lesson 4"]], ["Latency", "How long you wait for a response. It grows with the number of tokens read and written, and with the size of the model.", null, null]]], ["Behavior and limits", [["Hallucination", "Output that sounds confident and plausible but is false or unsupported. The model produces likely-sounding text, not facts it has looked up.", "Citing a clause that isn’t in your return policy.", ["limits-risks.html", "Lesson 7"]], ["Non-determinism (variability)", "The same prompt can give different answers because of sampling. A lower temperature reduces this but doesn’t always remove it.", null, ["inference.html", "Lesson 4"]], ["Bias", "A systematic skew in outputs, reflecting patterns in the training data or in how the model was tuned.", null, ["limits-risks.html", "Lesson 7"]], ["Knowledge cutoff", "The point after which the model has no training data. Newer facts have to be supplied in the prompt.", "A model won’t know about last week’s policy change unless you tell it.", null], ["Context limit", "When text is longer than the context window, some of it must be left out or shortened. Models can also overlook details buried in very long prompts.", null, ["tokens.html", "Lesson 2"]], ["Prompt sensitivity", "Small changes in wording, order or detail can change the answer.", null, ["context-attention.html", "Lesson 5"]], ["Confidentiality", "Whether information stays under your control. Text sent to an unapproved tool may not.", "Pasting a client contract into a public chatbot.", ["limits-risks.html", "Lesson 7"]], ["Copyright and ownership", "Questions about whether training data, and generated output, infringe or can be owned. The rules are still developing.", null, ["limits-risks.html", "Lesson 7"]]]], ["Using models at work", [["System prompt", "Standing instructions that set the role, tone and rules for a model across a conversation. It is usually written by whoever builds the product.", null, null], ["Prompt engineering", "Writing prompts and choosing context so that outputs are more reliable.", null, ["context-attention.html", "Lesson 5"]], ["Grounding", "Tying the model’s answer to source material you supply.", "“Answer using only the policy text below.”", ["context-attention.html", "Lesson 5"]], ["RAG (retrieval-augmented generation)", "A setup that searches your own documents for relevant passages and adds them to the prompt before the model answers.", null, ["adapt-to-business.html", "Lesson 8"]], ["Guardrails", "Checks and rules placed around a model to limit unwanted outputs or actions.", null, null], ["Human review", "A person checks the output before it is used, especially for high-stakes decisions.", "Sign-off on any refund over $1,000.", ["context-attention.html", "Lesson 5"]], ["Agent", "A system where a model plans steps, calls tools such as a database or email, and continues until a goal is met.", "Looks up an order, drafts a refund and asks a person to approve.", ["llm-uses.html", "Lesson 6"]], ["Open-weights model", "A model whose parameters are published so you can run it yourself.", null, ["cost-and-choice.html", "Lesson 9"]], ["Multimodal", "A model that handles more than text, such as images, audio or video.", null, ["cost-and-choice.html", "Lesson 9"]], ["Model size", "Roughly the number of parameters. Larger models are usually more capable, but cost more and respond more slowly.", null, ["cost-and-choice.html", "Lesson 9"]]]]];

/* ===== visuals: [kind, builder] ===== */
const CONT = [["it was damaged", 22], ["it didn’t fit", 15], ["it arrived late", 13], ["it wasn’t what they expected", 11], ["it stopped working", 10], ["they changed their mind", 9], ["they found a lower price", 6], ["the size was wrong", 5], ["it was the wrong color", 4], ["they received a duplicate", 3], ["they were unhappy with the service", 2]];
const BASE = (() => { const z = CONT.reduce((a, c) => a + c[1], 0); return CONT.map(c => c[1] / z); })();
const flowd = (items) => { const d = h("div", { class: "flowd" }); items.forEach((it, i) => { if (i) d.append(h("span", { class: "ar", text: "→" })); const o = typeof it === "object"; d.append(h("span", { class: "fb" + (o && it.c ? " " + it.c : ""), text: o ? it.t : it })); }); return d; };
const vstack = items => h("div", { class: "vstack" }, items.map(it => h("div", { class: "fb" + (it.c ? " " + it.c : ""), text: it.t })));
const svgBox = (w, hh, inner) => { const d = h("div"); d.innerHTML = '<svg class="dg chart" viewBox="0 0 ' + w + " " + hh + '" role="img">' + inner + "</svg>"; return d; };
const slider = (label, min, max, step, val, on) => { const out = h("b", { text: "" }), inp = h("input", { type: "range", min, max, step, value: val }); const upd = () => { out.textContent = label.fmt ? label.fmt(+inp.value) : inp.value; on(+inp.value); }; inp.oninput = upd; const el = h("label", { class: "field" }, h("span", null, label.t + ": ", out), inp); setTimeout(upd, 0); return el; };
const sentWords = "the customer returned the product because it was damaged .".split(" ");
const EMB = { refund: [16, 22], reimbursement: [30, 12], credit: [12, 42], payment: [32, 36], damaged: [72, 18], broken: [86, 32], faulty: [66, 40], cracked: [82, 10], late: [22, 78], delayed: [38, 88], slow: [14, 90], return: [50, 54], package: [64, 76] };
const VIZ = {
  "LLM (large language model)": ["Picture", () => flowd(["Text so far", { t: "LLM", c: "acc" }, "Odds for the next token", "One token picked", "Added to the text, then repeat"])],
  "Model": ["Picture", () => h("div", { class: "flowd" }, h("span", { class: "fb", text: "Structure (the fixed design)" }), "+", h("span", { class: "fb", text: "Parameters (learned numbers)" }), "=", h("span", { class: "fb acc", text: "The model" }))],
  "Parameters (weights)": ["Try it: nudge the numbers", () => {
    const vals = Array.from({ length: 32 }, () => +(Math.random() * 2 - 1).toFixed(2)), g = h("div", { class: "grid-n" }), note = h("p", { class: "hint", text: "Each cell is one parameter. A real model has billions." });
    const draw = () => { clear(g); vals.forEach(v => g.append(h("span", { style: { background: "color-mix(in srgb, var(--accent) " + Math.round(Math.abs(v) * 70) + "%, var(--soft))" }, text: v.toFixed(2) }))); };
    draw(); return h("div", { class: "stack", style: { gap: "10px" } }, g, h("div", { class: "row" }, h("button", { class: "btn", onclick: () => { vals.forEach((v, i) => vals[i] = +Math.max(-1, Math.min(1, v + (Math.random() - 0.5) * 0.3)).toFixed(2)); draw(); note.textContent = "That was one tiny adjustment. Training makes millions of these, guided by the error score."; } }, "Nudge them"), h("button", { class: "btn", onclick: () => { vals.forEach((v, i) => vals[i] = 0); draw(); note.textContent = "Before training the numbers are near zero, so the model has no preferences."; } }, "Reset to zero")), note);
  }],
  "Neural network": ["Picture", () => { const L = [3, 5, 5, 2], X = [30, 110, 190, 270]; let s = ""; const pos = L.map((n, i) => Array.from({ length: n }, (_, k) => [X[i], 20 + (k + 0.5) * (120 / n)])); for (let i = 0; i < L.length - 1; i++) pos[i].forEach(a => pos[i + 1].forEach(b => s += '<line class="ed" x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '"/>')); pos.forEach(l => l.forEach(p => s += '<circle class="nd" cx="' + p[0] + '" cy="' + p[1] + '" r="7"/>')); s += '<text class="mut" x="30" y="170" text-anchor="middle">input</text><text class="mut" x="150" y="170" text-anchor="middle">layers of simple calculations</text><text class="mut" x="270" y="170" text-anchor="middle">output</text>'; return svgBox(300, 180, s); }],
  "Transformer": ["Picture", () => vstack([{ t: "Tokens in" }, { t: "Embeddings (numbers for each token)" }, { t: "Attention: tokens look at each other, then processing. Repeated across many layers.", c: "acc" }, { t: "Odds for the next token" }])],
  "Prompt": ["Picture", () => { const d = h("div", { class: "vstack" }); [["Instruction", "You are a support assistant. Reply in two sentences.", "acc"], ["Background facts", "Policy: 30-day free returns. The order was placed 5 days ago.", ""], ["Question", "Should we approve this refund?", "acc"]].forEach(([l, t, c]) => d.append(h("div", { class: "pcard" }, h("small", { text: l }), h("span", { text: t })))); return d; }],
  "Token": ["Try it: type a word", () => { const inp = h("input", { type: "text", value: "unrefundable", "aria-label": "Word to split" }), out = h("div"); const u = () => { clear(out).append(tokChips(tokenize(inp.value)), h("p", { class: "hint", text: tokenize(inp.value).length + " token" + (tokenize(inp.value).length === 1 ? "" : "s") })); }; inp.oninput = u; u(); return h("div", { class: "stack", style: { gap: "10px" } }, inp, out); }],
  "Tokenizer": ["Picture", () => { const t = tokenize("Refund issued for order 48213"); return h("div", { class: "stack", style: { gap: "10px" } }, flowd(["Text", "Tokens", "ID numbers"]), tokChips(t.map(x => ({ t: x, id: tokId(x) })))); }],
  "Vocabulary": ["Picture", () => h("div", { class: "stack", style: { gap: "8px" } }, tokChips(VOCAB.slice(1, 20).concat(["…"])), h("p", { class: "hint", text: "The demo model’s whole vocabulary is 35 tokens. A real one has tens of thousands or more." }))],
  "Token ID": ["Picture", () => tokChips(["the", "customer", "returned", "refund"].map(w => ({ t: w, id: "#" + VI[w] })))],
  "Context window": ["Try it: fill the window", () => { const W = 8000, bar = h("div", { class: "track", style: { height: "22px" } }), fill = h("i", {}), msg = h("p", { class: "hint" }); bar.append(fill); return h("div", { class: "stack", style: { gap: "10px" } }, slider({ t: "Prompt length (tokens)", fmt: v => v.toLocaleString() }, 0, 9000, 250, 3000, v => { const used = Math.min(v, W); fill.style.width = used / W * 100 + "%"; fill.style.background = v > W ? "var(--bad)" : "var(--accent)"; msg.textContent = v > W ? "Over the example 8,000-token window by " + (v - W).toLocaleString() + ". Something has to be cut." : (W - v).toLocaleString() + " tokens left for the reply, out of an example window of 8,000. Real windows today run to hundreds of thousands of tokens or more."; }), bar, msg); }],
  "Embedding": ["Try it: tap a word", () => {
    const box = h("div", { class: "plot" }), names = Object.keys(EMB), list = h("p", { class: "hint", text: "Tap a word to see which words sit closest to it. Positions are illustrative." });
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("viewBox", "0 0 100 100"); svg.setAttribute("preserveAspectRatio", "none"); box.append(svg);
    const sel = w => { svg.innerHTML = ""; const d = names.filter(n => n !== w).sort((a, b) => Math.hypot(EMB[a][0] - EMB[w][0], EMB[a][1] - EMB[w][1]) - Math.hypot(EMB[b][0] - EMB[w][0], EMB[b][1] - EMB[w][1])).slice(0, 3); d.forEach(n => { const l = document.createElementNS("http://www.w3.org/2000/svg", "line"); [["x1", EMB[w][0]], ["y1", EMB[w][1]], ["x2", EMB[n][0]], ["y2", EMB[n][1]]].forEach(([k, v]) => l.setAttribute(k, v)); l.setAttribute("stroke", cssv("--accent")); l.setAttribute("stroke-width", "1.5"); l.setAttribute("vector-effect", "non-scaling-stroke"); svg.append(l); }); [...box.querySelectorAll("button")].forEach(b => { b.className = b.textContent === w ? "sel" : (d.includes(b.textContent) ? "nb" : ""); }); list.textContent = "Closest to “" + w + "”: " + d.join(", ") + "."; };
    names.forEach(n => box.append(h("button", { style: { left: EMB[n][0] + "%", top: EMB[n][1] + "%" }, onclick: () => sel(n) }, n))); sel("refund"); return h("div", { class: "stack", style: { gap: "10px" } }, box, list);
  }],
  "Attention": ["Try it: change the last word", () => { let last = "defective"; const out = h("div"), sw = h("div", { class: "seg3" }); const draw = () => { const w = [...ATT_WORDS, last], a = attention(w, w.length - 1); clear(out).append(bars(w.map((t, i) => ({ label: t, p: a[i], cls: a[i] === Math.max(...a) ? "hit" : "" })), { max: Math.max(...a) })); [...sw.children].forEach(b => b.classList.toggle("on", b.textContent === last)); }; ["defective", "closed"].forEach(x => sw.append(h("button", { onclick: () => { last = x; draw(); } }, x))); draw(); return h("div", { class: "stack", style: { gap: "10px" } }, h("p", { class: "hint", text: "“The customer returned the laptop to the store because it was …”" }), sw, out); }],
  "Context": ["Picture", () => vstack([{ t: "Standing instructions (system prompt)" }, { t: "Documents you include" }, { t: "The conversation so far" }, { t: "Your latest question", c: "acc" }, { t: "Words the model has already written", c: "acc" }])],
  "Training data": ["Picture", () => { const w = ["<s>", ...CORPUS[0].split(" ")], d = h("div", { class: "stack", style: { gap: "8px" } }, h("div", { class: "sent" }, w.slice(1).map(x => h("span", { text: x })))); const l = h("div", { class: "out-list" }); for (let k = 0; k < 4; k++) l.append(h("div", null, h("span", { text: "after “" + (w[k] === "<s>" ? "(start)" : w[k]) + "” comes “" + w[k + 1] + "”" }))); d.append(l, h("p", { class: "hint", text: "Every sentence in the data becomes many such examples." })); return d; }],
  "Training": ["Picture", () => h("div", { class: "stack", style: { gap: "8px" } }, flowd(["Take an example", "Guess", "Check", "Adjust", "↻ Repeat"]), h("p", { class: "hint", text: "The same loop you ran in Lesson 3." }))],
  "Next-token prediction": ["Picture", () => h("div", { class: "stack", style: { gap: "8px" } }, h("div", { class: "big", text: "The customer returned the product because …" }), bars(CONT.slice(0, 5).map(([l, p]) => ({ label: l, p: p / 100 })), { max: 0.25 }))],
  "Error score (loss)": ["Try it: set the chance", () => { const box = h("div"); const W = 300, H = 150, X = p => 30 + p * 260, Y = v => 130 - Math.min(v, 4.8) / 4.8 * 110; let path = ""; for (let p = 0.01; p <= 0.995; p += 0.01) path += (path ? "L" : "M") + X(p).toFixed(1) + "," + Y(-Math.log(p)).toFixed(1); return h("div", { class: "stack", style: { gap: "10px" } }, slider({ t: "Chance the model gave the right word", fmt: v => v + "%" }, 1, 99, 1, 20, v => { const e = -Math.log(v / 100); clear(box).append(svgBox(W, H, '<path d="' + path + '" fill="none" stroke="' + cssv("--muted") + '" stroke-width="2"/><circle cx="' + X(v / 100) + '" cy="' + Y(e) + '" r="6" fill="' + cssv("--accent") + '"/><text class="mut" x="30" y="146">0%</text><text class="mut" x="290" y="146" text-anchor="end">100%</text><text class="mut" x="26" y="26" text-anchor="end">high</text><text class="mut" x="26" y="130" text-anchor="end">low</text>'), h("div", { class: "stats" }, h("span", null, h("b", { text: e.toFixed(2) }), "error score"))); }), box); }],
  "Learning rate": ["Try it: change the step size", () => { const box = h("div"), msg = h("p", { class: "hint" }); const W = 300, H = 150, X = x => 150 + x * 22, Y = y => 135 - Math.min(y, 30) / 30 * 120; let par = ""; for (let x = -6; x <= 6; x += 0.25) par += (par ? "L" : "M") + X(x).toFixed(1) + "," + Y(x * x).toFixed(1); return h("div", { class: "stack", style: { gap: "10px" } }, slider({ t: "Step size", fmt: v => v.toFixed(2) }, 0.05, 1.2, 0.05, 0.3, lr => { let x = 4; const pts = [[x, x * x]]; for (let k = 0; k < 8; k++) { x = x * (1 - 2 * lr); pts.push([x, x * x]); } const poly = pts.map(p => X(Math.max(-6, Math.min(6, p[0]))).toFixed(1) + "," + Y(p[1]).toFixed(1)).join(" "); clear(box).append(svgBox(W, H, '<path d="' + par + '" fill="none" stroke="' + cssv("--line") + '" stroke-width="2"/><polyline points="' + poly + '" fill="none" stroke="' + cssv("--accent") + '" stroke-width="1.5"/>' + pts.map(p => '<circle cx="' + X(Math.max(-6, Math.min(6, p[0]))).toFixed(1) + '" cy="' + Y(p[1]).toFixed(1) + '" r="3.5" fill="' + cssv("--accent") + '"/>').join("") + '<text class="mut" x="150" y="148" text-anchor="middle">lowest error</text>')); msg.textContent = lr < 0.15 ? "Too small: eight steps barely move it. Training would take very long." : lr <= 0.5 ? "A steady approach to the lowest error." : lr <= 1.0 ? "Overshoots and bounces, but settles." : "Too large: each step overshoots further and the error grows."; }), box, msg); }],
  "Pre-training": ["Picture", () => flowd(["A huge amount of general text", { t: "Pre-training", c: "acc" }, "A general-purpose model"])],
  "Fine-tuning": ["Picture", () => h("div", { class: "stack", style: { gap: "8px" } }, flowd(["A general-purpose model", "+ a small set of your examples", { t: "Fine-tuning", c: "acc" }, "A model tuned to your task"]), h("p", { class: "hint", text: "Both stages adjust the parameters. Writing a better prompt does not." }))],
  "Inference": ["Picture", () => flowd(["Your prompt", { t: "Trained model (parameters fixed)", c: "acc" }, "Reply"])],
