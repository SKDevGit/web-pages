<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Is this AI?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../assets/css/site.css">
</head><body>
<header id="site-head"></header>
<main class="col" id="lesson"></main>
<nav id="pager"></nav>
<script src="../../assets/js/site.js"></script><script src="js/ait.js"></script>
<script>
lesson({
  title: "Is this AI?",
  lede: "Everyone has an idea of what AI is. Before any definitions, vote on five everyday items and notice what made you decide. You will come back to this vote at the end.",
  learn: `<b>By the end of this module you can</b>
<ol class="obj">
<li>Explain what people mean by AI, and why the label keeps moving.</li>
<li>Tell analytical AI from generative AI, and rules from learning.</li>
<li>Describe in plain language what a model is, and why training data matters.</li>
<li>Weigh the cost of a model’s mistakes, and decide when AI is the right tool.</li>
<li>Explain why natural language is a new interface, and what changes for people.</li>
</ol>`,
  steps: [
    {
      title: "Vote on five items",
      main: `<p>For each item, choose Yes, No or Unsure. There is no single right answer, and that is the point.</p>
<p>Notice what makes you decide. You will see the same five items again in the wrap-up.</p>`,
      interactive: votes,
      deep: `<p>These items are illustrative. Your votes are saved in this browser, so you can compare them with your answers at the end of the module.</p>
<p>Some items are clear, and some depend on where you draw the line. Lesson 2 gives the working definition, and the wrap-up shows how your votes compare with it.</p>`,
      quiz: `<p>After the vote, which item did you find hardest to decide, and what would settle it?</p>`
    },
    {
      title: "Five questions before you start",
      main: `<p>Answer these with your group before we begin. You will see the same five again in the wrap-up, so you can see what has changed.</p>
<ol class="obj">${QUIZ.map(q => "<li>" + q[0] + "</li>").join("")}</ol>`,
      deep: `<p>It is fine to be unsure. The point is to notice what you already think, so the change by the end of the module is visible.</p>`,
      quiz: QUIZ
    }
  ]
});
chrome(0);
</script>
</body></html>
